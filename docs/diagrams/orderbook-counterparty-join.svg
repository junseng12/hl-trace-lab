<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Orderbook counterparty reconstruction</title>
  <desc id="desc">Target user fills are joined to live trades, recent trades, or node archives using coin, time, and trade id.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.source{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.live{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.archive{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.join{fill:#fef3c7;stroke:#d97706;stroke-width:2}.result{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.t{font:700 27px system-ui,sans-serif;fill:#0f172a}.h{font:700 18px system-ui,sans-serif;fill:#0f172a}.p{font:14px system-ui,sans-serif;fill:#334155}.m{font:13px ui-monospace,monospace;fill:#334155}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){.bg{fill:#0f172a}.panel{fill:#111827;stroke:#475569}.source{fill:#172554;stroke:#60a5fa}.live{fill:#052e16;stroke:#4ade80}.archive{fill:#2e1065;stroke:#c4b5fd}.join{fill:#451a03;stroke:#fbbf24}.result{fill:#450a0a;stroke:#f87171}.t,.h{fill:#f8fafc}.p,.m{fill:#cbd5e1}.line{stroke:#94a3b8}}
    </style>
  </defs>
  <rect class="bg" width="1280" height="700" rx="20"/>
  <text class="t" x="55" y="50">Orderbook value-transfer tracing · evidence join</text>

  <rect class="source" x="55" y="100" width="290" height="145" rx="16"/>
  <text class="h" x="82" y="137">Target userFills API</text><text class="p" x="82" y="168">Target's own price, size, side,</text><text class="p" x="82" y="190">PnL, hash, oid and tid</text><text class="m" x="82" y="220">counterparty: absent</text>

  <rect class="live" x="55" y="285" width="290" height="120" rx="16"/>
  <text class="h" x="82" y="322">trades WebSocket</text><text class="p" x="82" y="351">Market subscription started first</text><text class="m" x="82" y="378">users = [buyer, seller]</text>
  <rect class="live" x="55" y="435" width="290" height="105" rx="16"/>
  <text class="h" x="82" y="472">recentTrades API</text><text class="p" x="82" y="501">Short-lived immediate fallback</text>
  <rect class="archive" x="55" y="570" width="290" height="90" rx="16"/>
  <text class="h" x="82" y="607">node_fills_by_block</text><text class="p" x="82" y="635">Historical, both fill sides</text>

  <rect class="join" x="465" y="245" width="340" height="190" rx="18"/>
  <text class="h" x="500" y="285">Stable per-fill join key</text><text class="m" x="520" y="325">(coin, time, tid)</text><text class="p" x="500" y="365">Same key = same executed fill</text><text class="p" x="500" y="392">WebSocket first; recent/archive fallback</text>
  <path class="line" d="M345 172C410 172 405 300 457 315"/><path class="line" d="M345 345H457"/><path class="line" d="M345 487C410 487 405 390 457 372"/><path class="line" d="M345 615C430 615 410 425 457 405"/>

  <rect class="result" x="925" y="190" width="300" height="160" rx="18"/>
  <text class="h" x="955" y="230">Recovered trade edge</text><text class="m" x="955" y="267">target A ↔ counterparty B</text><text class="p" x="955" y="298">market · price · size · direction</text><text class="p" x="955" y="323">evidence source retained</text>
  <path class="line" d="M805 340H917"/>

  <rect class="panel" x="900" y="420" width="325" height="200" rx="18"/>
  <text class="h" x="930" y="460">Risk analysis after reconstruction</text><text class="p" x="930" y="495">• repeated counterparty concentration</text><text class="p" x="930" y="525">• price deviation from market</text><text class="p" x="930" y="555">• symmetric opposite positions</text><text class="p" x="930" y="585">• funding, PnL and onward flows</text>
  <path class="line" d="M1075 350V412"/>
  <text class="p" x="465" y="650">A reconstructed edge proves a fill relationship; intent requires additional behavioral evidence.</text>
</svg>
